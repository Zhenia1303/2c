<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI</title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>
    <div class="baner">
        <h1>Kalkulator BMI</h1>
    </div>
    <div class="panel-lewy">
        <h2>Wybierz opcję</h2>
        <ul>
            <li><a href="index.html">oblisz BMI</a></li>
            <li><a href="o-bmi.html">co jest BMI</a></li>
            <li><a href="kontakt.htm">kontakt</a></li>
        </ul>
    </div>
    <div class="panel-prawy">
        <h1>Oblicz swój wskaźnik BMI</h1>
        <form>
            <div>
                <p>Waga (kg):</p><input id="waga" type="text">
            </div>
            <div>
                <p>Wzrost (cm):</p><input id="wzrost" type="text">
            </div>
            <button id="click" type="button">Oblicz BMI</button>
            <p id="wynik">wynik</p>
            <p id="result">result</p>
        </form>
    </div>
    <div class="stopka">
        <h3>Kalkulator BMI</h3>
        <p>Zadanie wykonał: ja, człowiek</p>
    </div>




    <script src="index.js"></script>
</body>

</html>
